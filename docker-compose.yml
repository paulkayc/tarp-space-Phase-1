

services:
  postgres:
    # image: pgvector/pgvector:pg16-trixie
    build: .
    container_name: tarpspace-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tarpspace
      POSTGRES_PASSWORD: tarpspace
      POSTGRES_DB: tarpspace
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tarpspace"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
      - ./db:/db

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file: ./frontend/.env.local
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
