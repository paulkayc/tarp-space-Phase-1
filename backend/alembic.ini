[alembic]
# Path to migration scripts — relative to this file (backend/)
script_location = /db
version_locations = /db/migrations

# Naming convention: YYYYMMDD_NNN_description
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# SQLAlchemy URL — overridden by env.py reading DATABASE_URL
sqlalchemy.url = postgresql://tarpspace:tarpspace@postgres:5432/tarpspace

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
