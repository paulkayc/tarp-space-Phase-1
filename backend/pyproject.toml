[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tarpspace-backend"
version = "1.0.0"
description = "Tarp-Space FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "anthropic>=0.28.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "geoalchemy2>=0.14.6",
    "python-jose[cryptography]>=3.3.0",
    "jinja2>=3.1.4",
    "bleach>=6.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
